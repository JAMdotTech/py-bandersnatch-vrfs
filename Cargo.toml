[package]
name = "py_bandersnatch_vrfs"
description = "Python Bandersnatch VRFs library utilizing the RUST ark-ec-vrfs cryptographic library"
authors=["JAMdot Technologies"]
version = "0.6.3"
repository = "https://github.com/JAMdotTech/py-bandersnatch-vrfs"
homepage = "https://github.com/JAMdotTech/py-bandersnatch-vrfs"
license = "Apache-2.0"
readme = "README.md"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "bandersnatch_vrfs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
# See docs/compatibility.md before changing JAM's cryptographic protocol backend.
ark-vrf = { version = "=0.2.2", features = ["bandersnatch", "ring", "parallel"] }

